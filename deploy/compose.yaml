name: ripple-prod

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  mysql:
    <<: *common
    image: ${MYSQL_IMAGE:?build.sh must generate images.env}
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a root password}
      MYSQL_DATABASE: ripple
      MYSQL_USER: ripple
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set an application password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/ripple.cnf:ro
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D ripple -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [private]

  redis:
    <<: *common
    image: ${REDIS_IMAGE:?build.sh must generate images.env}
    pull_policy: never
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory, 24mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    mem_limit: 80m
    memswap_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]

  app:
    <<: *common
    image: ${APP_IMAGE:?build.sh must generate images.env}
    pull_policy: never
    environment:
      RIPPLE_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set an application password}
      RIPPLE_AUTH_SECRET: ${AUTH_SECRET:?generate an authentication secret}
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 160m
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      # Liveness only; apply.sh also queries a database-backed API.
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/ping]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [private]

  web:
    <<: *common
    image: ${WEB_IMAGE:?build.sh must generate images.env}
    pull_policy: never
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-ripple.jasperlab.dev}
      GOMEMLIMIT: 40MiB
      GOMAXPROCS: "1"
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
    memswap_limit: 96m
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      private:
        ipv4_address: 172.30.50.2
      public: {}

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.50.0/28
          ip_range: 172.30.50.8/29
  public: {}

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
